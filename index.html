<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
      padding: 50px 20px;
    }.card {
  background: white;
  max-width: 350px;
  margin: auto;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 4px 12px #0002;
}
button {
  background: #111;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 14px 20px;
  font-size: 16px;
  width: 100%;
  cursor: pointer;
}

  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome!</h1>
    <p>Connect your TikTok account securely.</p>
    <button onclick="loginWithTikTok()">Continue with TikTok</button>
    <p id="message"></p>
  </div>  <script>
    function loginWithTikTok() {
      document.getElementById("message").textContent =
        "TikTok Login Kit configuration is needed before login can work.";
    }
  </script></body>
</html>
